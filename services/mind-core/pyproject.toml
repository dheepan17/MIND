[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-core"
version = "0.1.0"
description = "Core orchestration engine for the MIND agent framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MIND" }]
# psycopg is required by the migration runner (migrations/run.py) and the
# DB-backed schema tests to connect to PostgreSQL. fastapi is the HTTP
# boundary (app/main.py); httpx backs Starlette's TestClient used by the
# API tests. Both are required at runtime/test for the Phase 5.1 boundary.
dependencies = ["psycopg[binary]>=3.1", "fastapi>=0.110", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Route tests use Depends(...) in endpoint default arguments, which is the
# idiomatic FastAPI pattern (ruff B008). Tests are not production routes.
"tests/**" = ["B008"]
